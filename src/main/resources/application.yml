server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        git:
          uri: https://github.com/Shavindi0609/Library-Management-Configurations.git
          search-paths: platform,services
        native:
          search-locations:
            - classpath:/configurations/
            - classpath:/configurations/platform/
            - classpath:/configurations/services/

eureka:
  client:
    enabled: false